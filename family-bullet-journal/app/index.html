<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script>/* Family Bullet Journal — moteur de stockage local (hors ligne d'abord).
 * Remplace le stockage claude.ai par IndexedDB, avec la même interface (collection/doc/get/set/delete).
 * Chaque document garde updated_at + dirty + deleted (pierre tombale) : c'est ce qui permettra
 * plus tard de synchroniser avec Supabase sans changer le reste de l'appli. */
(function () {
  "use strict";
  var DB_NAME = "fbj-cocon", STORE = "docs", META = "meta";
  var mem = new Map();          // path -> {path, data, updated_at, deleted, dirty}
  var idb = null, uid = null;

  function openIdb() {
    return new Promise(function (res) {
      if (!("indexedDB" in window)) return res(null);
      var r;
      try { r = indexedDB.open(DB_NAME, 1); } catch (e) { return res(null); }
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "path" });
        if (!d.objectStoreNames.contains(META)) d.createObjectStore(META);
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };
    });
  }
  function all(store) {
    return new Promise(function (res) {
      if (!idb) return res([]);
      var out = [], c = idb.transaction(store).objectStore(store).openCursor();
      c.onsuccess = function () { var cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else res(out); };
      c.onerror = function () { res(out); };
    });
  }
  function put(store, value, key) {
    return new Promise(function (res, rej) {
      if (!idb) return res();
      var tx = idb.transaction(store, "readwrite");
      key === undefined ? tx.objectStore(store).put(value) : tx.objectStore(store).put(value, key);
      tx.oncomplete = function () { res(); };
      tx.onerror = function () { rej(tx.error); };
      tx.onabort = function () { rej(tx.error); };
    });
  }
  function clearStore(store) {
    return new Promise(function (res) {
      if (!idb) return res();
      var tx = idb.transaction(store, "readwrite"); tx.objectStore(store).clear();
      tx.oncomplete = function () { res(); }; tx.onerror = function () { res(); };
    });
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function newId() {
    var r = (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(16) + Math.random().toString(16).slice(2));
    return "u_local_" + r.replace(/-/g, "").slice(0, 22);
  }

  var ready = (async function () {
    idb = await openIdb();
    var rows = await all(STORE);
    rows.forEach(function (kv) { mem.set(kv[0], kv[1]); });
    var meta = await all(META);
    meta.forEach(function (kv) { if (kv[0] === "uid") uid = kv[1]; });
    uid = uid || lsGet("fbj.uid") || newId();
    lsSet("fbj.uid", uid);
    await put(META, uid, "uid").catch(function () {});
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  })();

  function clone(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function snap(path) {
    var r = mem.get(path), ok = !!(r && !r.deleted);
    return { exists: ok, id: path.split("/").pop(), data: function () { return ok ? clone(r.data) : undefined; } };
  }
  async function write(path, data, deleted) {
    var rec = { path: path, data: deleted ? null : clone(data), updated_at: new Date().toISOString(), deleted: !!deleted, dirty: true };
    var prev = mem.get(path);
    mem.set(path, rec);
    try { await put(STORE, rec); }
    catch (e) {
      prev ? mem.set(path, prev) : mem.delete(path);
      var err = new Error("quota"); err.code = (e && e.name === "QuotaExceededError") ? "quota_exceeded" : "write_failed"; throw err;
    }
    window.dispatchEvent(new CustomEvent("fbj-local-change", { detail: { path: path } }));
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path: path,
      get: async function () { await ready; return snap(path); },
      set: async function (d) { await ready; return write(path, d, false); },
      delete: async function () { await ready; return write(path, null, true); },
      acquire: async function () { return { acquired: true }; },
      collection: function (n) { return colRef(path + "/" + n); },
    };
  }
  function colRef(path) {
    return {
      path: path,
      doc: function (id) { return docRef(path + "/" + id); },
      get: async function () {
        await ready;
        var pre = path + "/", docs = [];
        mem.forEach(function (r, k) {
          if (!r.deleted && k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") < 0) docs.push(snap(k));
        });
        return { docs: docs, size: docs.length, empty: docs.length === 0 };
      },
    };
  }
  var db = Object.freeze({ collection: colRef, doc: docRef });
  var userNs = Object.freeze({ id: async function () { await ready; return uid; }, isOwner: function () { return true; }, canEdit: function () { return true; } });
  var downloads = Object.freeze({
    save: async function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([typeof o.data === "string" ? o.data : JSON.stringify(o.data, null, 2)], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename || "export.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      return true;
    },
  });

  // --- Sauvegarde / restauration complète (tous les documents bruts) ---
  async function backup() {
    await ready;
    var docs = [];
    mem.forEach(function (r) { if (!r.deleted) docs.push({ path: r.path, data: r.data, updated_at: r.updated_at }); });
    return { format: "fbj-cocon-backup", version: 1, exported_at: new Date().toISOString(), uid: uid, docs: docs };
  }
  async function restore(obj, chooseUid) {
    await ready;
    if (!obj || obj.format !== "fbj-cocon-backup" || !Array.isArray(obj.docs)) throw new Error("Ce fichier n'est pas une sauvegarde du journal.");
    var members = obj.docs.filter(function (d) { return /^members\/[^/]+$/.test(d.path) && d.data; }).map(function (d) { return d.data; });
    var newUid = uid;
    if (!members.some(function (m) { return m.user_id === uid; })) {
      if (members.length === 1) newUid = members[0].user_id;
      else if (members.length > 1) newUid = await chooseUid(members);
      if (!newUid) throw new Error("Restauration annulée.");
    }
    await clearStore(STORE); mem.clear();
    for (var i = 0; i < obj.docs.length; i++) {
      var d = obj.docs[i];
      if (typeof d.path !== "string") continue;
      var rec = { path: d.path, data: d.data, updated_at: d.updated_at || new Date().toISOString(), deleted: false, dirty: true };
      mem.set(d.path, rec); await put(STORE, rec);
    }
    uid = newUid; lsSet("fbj.uid", uid); await put(META, uid, "uid");
  }
  // Points d'accroche pour la future synchro (Supabase) : documents modifiés hors ligne
  async function pending() { await ready; var o = []; mem.forEach(function (r) { if (r.dirty) o.push(clone(r)); }); return o; }

  window.FbjLocal = Object.freeze({ ready: ready, backup: backup, restore: restore, pending: pending, count: function () { var n = 0; mem.forEach(function (r) { if (!r.deleted) n++; }); return n; } });
  window.claude = Object.freeze({
    use: async function (name) {
      await ready;
      return name === "db" ? db : name === "user" ? userNs : name === "downloads" ? downloads : null;
    },
  });
})();
</script>

--bg:#1A1D1A;--surface:#242824;--surface-2:#2D322D;--sand:#3A3730;--ink:#EEEBE3;--ink-2:#B5B8AF;--ink-3:#959990;--line:#363B35;
--sage:#8FA890;--accent:#9DB59E;--accent-strong:#B3C8B4;--accent-ink:#172018;--accent-soft:#2E3A30;

--paper-line:#343932;color-scheme:dark}}
:root[data-theme=dark]{
--bg:#1A1D1A;--surface:#242824;--surface-2:#2D322D;--sand:#3A3730;--ink:#EEEBE3;--ink-2:#B5B8AF;--ink-3:#959990;--line:#363B35;
--sage:#8FA890;--accent:#9DB59E;--accent-strong:#B3C8B4;--accent-ink:#172018;--accent-soft:#2E3A30;
--peach:#E9B49A;--peach-soft:#3A2B24;--coral:#EBAA8C;--coral-soft:#3A2B24;
--warn:#E2B961;--warn-soft:#38301C;--danger:#EE9586;--danger-soft:#3F2420;--pos:#8CCB9E;
--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.18);--shadow-up:0 -6px 30px rgba(0,0,0,.4);
--il-line:#C9CCC2;--il-sage:#7E987F;--il-sage-l:#56695A;--il-pale:#283029;--il-sand:#5B5246;--il-sand-d:#6E6455;--il-peach:#C98F74;--il-peach-d:#E0A88C;--il-cream:#353A34;--il-wood:#A8865F;--il-sky:#1E2A33;--il-moonc:#F0E3C8;
--paper-line:#343932;color-scheme:dark}

body{font-family:var(--font);font-size:16.5px;line-height:1.5;letter-spacing:.005em;background:var(--bg)}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.015em}
h2{font-size:1.1rem;font-weight:800;letter-spacing:-.005em}
.btn,.chip,.segmented button,.nav-item,.quick-btn,.cat-btn,.link{font-weight:700}

/* --- Illustrations --- */
.ill{display:block;line-height:0}.ill svg{width:100%;height:auto;display:block}
.il-moon{display:none}.is-night{--il-sky:#DCE3E6}:root[data-theme=dark] .is-night{--il-sky:#1E2A33}.is-night .il-sun{display:none}.is-night .il-moon{display:inline}
.il-steam{animation:steam 3.2s ease-in-out infinite;transform-origin:center}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
.fbj-logo{display:inline-block;line-height:0;flex-shrink:0}.fbj-logo svg{width:100%;height:100%}

/* --- Cartes --- */
.card{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;gap:14px}
.card-head h2{font-size:1.08rem}
.stack{gap:16px}
.main{padding-top:14px}

/* --- En-tête de page --- */
.page-head{padding:8px 0 16px}
.page-head h1{font-size:1.55rem}
.subtitle{font-size:.95rem}
.profile-btn .avatar{box-shadow:0 0 0 3px var(--bg)}

/* --- Accueil --- */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0 14px}
.home-eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:4px}
.home-head h1{font-size:clamp(1.6rem,7vw,2rem);font-weight:850;line-height:1.1}
.home-date{color:var(--ink-2);margin-top:4px;font-weight:600}
.home-who{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;color:var(--ink)}
.home-who small{display:block;font-size:.68rem;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.home-who span{line-height:1.15;text-align:left}
.home-tools{display:flex;align-items:center;gap:2px;flex-shrink:0}
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--accent-soft);padding:20px 18px 0;display:grid;grid-template-columns:1fr;gap:6px;animation:rise .35s var(--ease)}
.hero-text{position:relative;z-index:1}
.hero-kicker{font-size:.8rem;font-weight:800;color:var(--accent-strong);letter-spacing:.06em;text-transform:uppercase}
.hero-msg{font-size:1.28rem;font-weight:750;line-height:1.3;margin-top:6px;color:var(--ink);text-wrap:balance}
.hero-sum{margin-top:8px;color:var(--ink-2);font-weight:600;font-size:.95rem}
.hero .ill{margin:0 -6px -4px;max-width:420px;justify-self:center;width:100%}
@media(min-width:560px){.hero{grid-template-columns:1.1fr 1fr;align-items:end;padding:24px 8px 0 26px}.hero-text{padding-bottom:26px}}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.glance a{display:flex;flex-direction:column;gap:2px;min-height:84px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .12s var(--ease)}
.glance a:active{transform:scale(.97)}
.glance .g-lab{font-size:.78rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.glance .g-val{font-size:1.2rem;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.glance .g-sub{font-size:.76rem;color:var(--ink-2);font-weight:600}
.glance a:nth-child(1) .g-lab svg{color:var(--accent-strong)}
.glance a:nth-child(2){background:var(--peach-soft);border-color:transparent}.glance a:nth-child(2) .g-lab svg{color:var(--coral)}
.glance a:nth-child(3){background:var(--surface-2);border-color:transparent}
.progress-dots{display:flex;gap:4px;margin-top:4px}
.progress-dots i{flex:1;height:5px;border-radius:9px;background:var(--line)}.progress-dots i.on{background:var(--sage)}
.soon-row{display:flex;gap:8px;flex-wrap:wrap}
.soon-pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px dashed var(--sand);color:var(--ink-2);font-size:.85rem;font-weight:700;text-decoration:none;background:transparent}
:root[data-theme=dark] .soon-pill{border-color:var(--line)}

/* actions rapides : rangée de pilules */
.quick{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick-btn{min-height:56px;flex-direction:row;gap:8px;border-radius:999px;box-shadow:none;border:1px solid var(--line);font-size:.95rem}
.quick-btn svg{width:20px;height:20px}
.quick-btn.accent{border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.quick-soon{font-size:.8rem}

/* tâches */
.tasks .task{border-bottom:1px dashed var(--line);min-height:62px}
.check .box{width:28px;height:28px;border-radius:9px;border:2px solid color-mix(in srgb,var(--ink-3) 70%,transparent);background:var(--surface)}
.check.on .box{background:var(--sage);border-color:var(--sage);animation:pop .25s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.task.done .task-title{color:var(--ink-3)}
.task-title{font-weight:650}
.group-title{font-size:.75rem;letter-spacing:.1em;color:var(--ink-2);font-weight:800}
.group.late .group-title{color:var(--danger)}
.count{background:var(--accent-soft);color:var(--accent-strong);font-weight:800}
.quick-add .input{border-radius:999px;padding-left:18px;background:var(--surface-2);border-color:transparent}
.quick-add .input:focus{background:var(--surface)}
.quick-add .icon-btn.filled{border-radius:999px}
.tasks-progress{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.92rem;color:var(--accent-strong)}
.tasks-progress .bar{flex:1;height:8px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.tasks-progress .bar-fill{background:var(--sage)}

/* budget du mois (accueil) : carte « enveloppe » */
section[aria-labelledby=today-finance]{background:linear-gradient(180deg,var(--peach-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--peach) 45%,var(--line))}
.money-big{font-size:clamp(1.7rem,9vw,2.2rem);font-weight:850;letter-spacing:-.02em}
.money-mid{font-weight:800}
.bar{height:10px;background:var(--surface-2)}
.bar-fill{background:var(--sage)}
.bar.level-save .bar-fill{background:var(--peach)}
.cat-bar span{background:var(--peach)}

/* note du jour : carnet ligné */
section[aria-labelledby=today-note]{background:var(--surface)}
.note-area{background-color:var(--surface);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--paper-line) 29px,var(--paper-line) 30px);background-attachment:local;line-height:30px;padding:6px 16px 6px 22px;border-radius:14px;border:1.5px solid var(--line);min-height:128px;box-shadow:inset 3px 0 0 color-mix(in srgb,var(--peach) 70%,transparent)}
.note-item{background:var(--surface-2);border-left:3px solid var(--peach)}

/* --- Boutons & champs --- */
.btn{border-radius:999px;min-height:50px;padding:0 22px}
.btn.small{border-radius:999px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.primary:hover:not(:disabled){background:var(--accent-strong)}
:root[data-theme=dark] .btn.primary:hover:not(:disabled){background:var(--accent)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
.icon-btn{border-radius:999px;color:var(--ink-2)}
.icon-btn.filled{background:var(--accent);color:var(--accent-ink)}
.input{border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.input:focus{border-color:var(--sage);box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 18%,transparent)}
.field>label,.field>.label{color:var(--ink-2);font-weight:750}
.segmented{background:var(--surface-2);border-radius:999px;padding:4px}
.segmented button{border-radius:999px;font-weight:700}
.segmented button.on{background:var(--surface);color:var(--accent-strong);box-shadow:0 1px 4px rgba(50,50,30,.12)}
.chip{border-radius:999px}
.chip.on,.cat-btn.on{background:var(--accent-soft);border-color:var(--sage);color:var(--accent-strong)}
.cat-btn{border-radius:16px}
.link{color:var(--accent-strong);font-weight:750}
a{color:var(--accent-strong)}
.badge{background:var(--peach-soft);color:var(--coral)}
.alert{border-radius:14px}
.prio{color:var(--coral)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--sage) 60%,transparent)}
.switch input{accent-color:var(--accent)}

/* --- Navigation inférieure --- */
.nav{background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom)}
.nav-item{color:var(--ink-2);font-weight:700;font-size:12px;gap:3px}
.nav-item.on{color:var(--accent-strong)}
.nav-item.on svg{background:var(--accent-soft);padding:3px 14px;width:54px;height:30px}
.nav-item:active svg{transform:scale(.92)}
.nav-item svg{transition:transform .12s var(--ease),background .2s}
.fab{border-radius:22px;background:var(--accent);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 38%,transparent)}
@media(min-width:900px){.nav{background:var(--surface)}.nav .nav-brand{font-weight:850;font-size:1.05rem;gap:10px;color:var(--ink)}.nav .nav-brand small{display:block;font-size:.72rem;font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}.nav-item{border-radius:999px}.nav-item.on{background:var(--accent-soft)}}

/* --- Pages à venir --- */
.soon-card{padding:0 0 24px;overflow:hidden;gap:12px}
.soon-card .ill{width:100%;max-width:340px;margin:8px auto 0;padding:10px 20px 0}
.soon-card h2{justify-content:center;font-size:1.2rem}
.soon-card>p,.soon-card>.plain{padding:0 22px}
.soon-card .plain{gap:10px;align-self:stretch}
.soon-card .plain li{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--surface-2);border-radius:14px;color:var(--ink);font-weight:600;font-size:.95rem}
.soon-tag{display:inline-block;align-self:center;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--peach-soft);color:var(--coral)}

/* --- États vides --- */
.empty{padding:14px 8px 18px;color:var(--ink-2)}
.empty .ill{width:170px;max-width:60%;margin-bottom:6px}
.empty-title{font-weight:800;color:var(--ink);font-size:1.02rem}

/* --- Budget (page) --- */
.period-nav{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.period-nav h2,.period-nav strong{font-weight:800}
.stats div{background:var(--surface-2);border-radius:16px}
.stats dd{font-size:1.02rem;font-weight:800}
.tx{border-bottom:1px dashed var(--line)}
.tx-icon{background:var(--peach-soft);border-radius:14px;width:42px;height:42px}
.tx-amount{font-weight:800}
.budget-sum{position:relative}.budget-sum .budget-ill{position:absolute;top:10px;right:10px;width:92px;pointer-events:none}.budget-sum .money-row .right{margin-top:60px}.budget-sum .money-row>div:first-child{padding-right:90px}@media(min-width:420px){.budget-sum .money-row>div:first-child{padding-right:0}}
.amount-input{font-weight:850}
.amount-wrap{border-bottom-style:dashed}

/* --- Réglages --- */
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.emoji{border-radius:14px;background:var(--surface-2)}
.emoji.on{border-color:var(--sage);background:var(--accent-soft)}
.order-list li{border-bottom:1px dashed var(--line)}

/* --- Feuilles (bottom sheets) --- */
.sheet-backdrop{background:rgba(30,32,26,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{border-radius:28px 28px 0 0;background:var(--surface)}
.sheet-head h2{font-size:1.2rem;font-weight:850}
.add-item{border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.add-icon{border-radius:14px;background:var(--accent-soft);color:var(--accent-strong)}
.add-item.accent .add-icon{background:var(--accent)}
@media(min-width:700px){.sheet{border-radius:28px}}

/* --- Démarrage / connexion --- */
.boot{background:radial-gradient(120% 60% at 50% 0%,var(--accent-soft),var(--bg) 70%)}
.boot .fbj-logo{filter:drop-shadow(0 8px 18px rgba(60,70,50,.12))}
.boot h1{font-size:1.6rem;font-weight:850}
.auth-card{border-radius:24px;border:1px solid var(--line)}
.picker-card{border-radius:24px}

/* --- Divers --- */
.toast{border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;padding:12px 18px}
.offline{border-radius:999px}
.update-banner{border-radius:16px}
.skeleton-line{border-radius:999px}
@media(prefers-reduced-motion:reduce){.il-steam{animation:none}}
@media(max-width:359px){.glance{grid-template-columns:1fr}.glance a{min-height:0;flex-direction:row;align-items:baseline;justify-content:space-between;flex-wrap:wrap}.quick-btn{font-size:.85rem;gap:4px;padding:0 6px}.home-who small{display:none}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .is-night{--il-sky:#1E2A33}}
.device-status{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong);font-weight:700;font-size:.85rem}.device-status.off{background:var(--warn-soft);color:var(--warn)}
/* barre du bas remontée (évite les éléments ajoutés en bas d'écran : barre de gestes Android, bouton Netlify) */
@media(max-width:899px){:root{--nav-h:84px}.nav{padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}}
