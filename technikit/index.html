<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechniKit</title>
<meta name="theme-color" content="#0e7c66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TechniKit">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;
--bg:#f3f5f9;--card:#fff;--tx:#18202b;--mut:#637083;--bd:#e0e5ec;--sh:0 1px 6px rgba(20,30,50,.08);--ac:#2f6fdd;--red:#d64545;--soft:#e9effc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1d232b;--tx:#e8ebef;--mut:#9aa5b1;--bd:#2f3640;--sh:none;--ac:#6aa8ff;--red:#e05a5a;--soft:#1f2c42}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1d232b;--tx:#e8ebef;--mut:#9aa5b1;--bd:#2f3640;--sh:none;--ac:#6aa8ff;--red:#e05a5a;--soft:#1f2c42}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.card b,.btn,#ttl,.hero b,.job .hr{font-family:"Poppins",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#ttl{flex:1;min-width:0;font-weight:700;font-size:1.1rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{flex:none;border:0;background:var(--card);box-shadow:var(--sh);border-radius:10px;width:40px;height:40px;font-size:1.2rem;color:var(--tx);cursor:pointer}
#gear{flex:none;border:0;background:none;font-size:1.3rem;line-height:1;padding:8px 4px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px))}
input,textarea,select,button{font:inherit;color:var(--tx)}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);min-height:44px}
textarea{resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;flex:none;accent-color:var(--ac)}
a{color:var(--ac)}

#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
#bnav button{border:0;background:none;border-radius:12px;min-height:50px;padding:3px 0;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
#bnav span{font-size:1.25rem;line-height:1.15;opacity:.65}
#bnav button.on{color:var(--ac);font-weight:700;background:var(--soft)}
#bnav button.on span{opacity:1}
.wel header,.wel #bnav{display:none}
.wel main{padding-bottom:24px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;width:100%;text-align:left;border:0;border-top:4px solid var(--c,var(--ac));border-radius:14px;padding:12px;cursor:pointer;
 background:var(--card);background:color-mix(in srgb,var(--c,var(--ac)) 12%,var(--card));box-shadow:var(--sh)}
.card:active,.btn:active,.hero:active,.job:active,.mini:active{transform:scale(.98)}
.card .ic{font-size:1.7rem;line-height:1.1}
.card .ic img{width:52px;height:52px;object-fit:cover;border-radius:10px;display:block}
.card b{display:block;margin-top:4px;font-size:1rem;overflow-wrap:anywhere}
.card small{display:block;color:var(--mut);line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.ttl{display:flex;align-items:center;gap:8px;font-size:1.25rem;line-height:1.25;margin:4px 0 10px;color:var(--c,var(--tx));overflow-wrap:anywhere}
.ttl .ic{font-size:1.55rem;flex:none}
.sub{color:var(--mut);font-size:.92rem;margin:-6px 0 10px}

.blk{background:var(--card);border-radius:14px;box-shadow:var(--sh);border-left:4px solid var(--c,var(--ac));padding:10px 12px;margin-bottom:10px}
.blk h3{margin:0 0 4px;font-size:1rem}
.blk p{margin:0}
.row{padding:6px 0;border-top:1px solid var(--bd)}
.blk>h3+.row{border-top:0}
.row b{display:block;font-weight:600}
.row span,.mut{color:var(--mut);font-size:.93rem}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.fl{display:block;font-size:.88rem;color:var(--mut);margin:8px 0 2px}
.fl input,.fl select,.fl textarea,.fl .pw{margin-top:3px;color:var(--tx)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px 14px;min-height:48px;background:var(--c,var(--ac));color:#fff;font-weight:600;font-size:1rem;cursor:pointer;text-align:center;text-decoration:none}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.btn.red{background:var(--red);color:#fff}
.btn.call{background:#16a34a;color:#fff}
.btn.sm{display:inline-block;width:auto;min-height:40px;padding:8px 12px;font-size:.92rem}
.btns{display:grid;gap:8px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger{margin-top:26px;padding-top:12px;border-top:1px dashed var(--bd)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1.05rem;padding:6px 8px}
.lnk{border:0;background:none;color:var(--ac);cursor:pointer;padding:10px;font-size:.95rem;text-decoration:underline}
.item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bd)}
.blk>h3+.item{border-top:0}
.item>div{min-width:0;overflow-wrap:anywhere}
.add{display:grid;gap:8px;margin-top:8px}
details.d>summary{cursor:pointer;font-weight:600;color:var(--c,var(--ac));padding:8px 0;list-style:none}
details.d>summary::-webkit-details-marker,details.more>summary::-webkit-details-marker{display:none}
details.more{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:0 12px;margin-bottom:10px}
details.more>summary{cursor:pointer;font-weight:600;padding:13px 0;list-style:none;color:var(--ac)}
details.more[open]{padding-bottom:10px}
details.more[open]>summary{border-bottom:1px solid var(--bd);margin-bottom:8px}
details.more .blk{box-shadow:none;border:1px solid var(--bd);border-left:4px solid var(--c,var(--ac))}
.badge{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--bd);margin:4px 4px 0 0}
.ban{font-size:.85rem;color:var(--mut);background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.pw{display:flex;gap:6px;align-items:flex-start}
.pw>input,.pw>textarea,.pw>select{flex:1;min-width:0}
.ibtn{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:10px;min-width:46px;height:46px;padding:0 10px;font-size:1.15rem;cursor:pointer;color:var(--tx)}
.ibtn.txt{font-size:.9rem;font-weight:600}
.ibtn.rec{background:var(--red);border-color:var(--red)}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.95rem;color:var(--tx)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:92vw;text-align:center;background:#222;color:#fff;padding:10px 16px;border-radius:14px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.wel #toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#toast.on{opacity:1}
.hide{display:none!important}
.blk{scroll-margin-top:120px}
.blk.warn{border-left-color:#d64545;background:var(--card);background:color-mix(in srgb,#d64545 7%,var(--card))}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:var(--sh)}}
.btn.okbig{--c:#16a34a;min-height:56px;font-size:1.08rem}
.adm #bnav,.adm #q,.nos #q{display:none}
.adm main{padding-bottom:24px}
.adm .top,.nos .top{margin-bottom:0}

.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:16px;padding:16px;margin:10px 0;cursor:pointer;background:var(--hc,#0e7c66);color:#fff;box-shadow:var(--sh)}
.hero .ic{font-size:2.1rem;flex:none}.hero b{display:block;font-size:1.1rem;letter-spacing:.2px}.hero small{display:block;opacity:.92}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.mini{position:relative;border:0;border-radius:12px;background:var(--card);box-shadow:var(--sh);padding:10px 4px;min-height:66px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.88rem;font-weight:600;color:var(--tx)}
.mini span{font-size:1.4rem;line-height:1.2}
.mini i{position:absolute;top:5px;right:7px;font-style:normal;background:#f59e0b;color:#fff;border-radius:99px;font-size:.72rem;padding:0 6px;font-weight:700}
.job{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-left:4px solid var(--c,#0e7c66);border-radius:14px;background:var(--card);box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--tx)}
.job .hr{flex:none;width:52px;font-weight:700;font-size:1.02rem;color:var(--c,#0e7c66);padding-top:1px}
.job .bd{flex:1;min-width:0}
.job b{display:block;overflow-wrap:anywhere;font-size:1rem}
.job small{display:block;color:var(--mut);overflow-wrap:anywhere}
.st{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:99px;font-weight:600;margin-top:4px;white-space:nowrap}
.st.todo{background:#fde7c4;color:#7a4a00}.st.ok{background:#d3f2e6;color:#0b5c49}
.st.wait{background:var(--soft);color:var(--tx)}.st.no{background:#e5e7eb;color:#475569}.st.info{background:#fef3c7;color:#7a4a00}
.bdg{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}.bdg .st{margin-top:2px}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px}
.tick{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);font-weight:600;font-size:.95rem;color:var(--tx);cursor:pointer}
.tick input{width:24px;height:24px;accent-color:#16a34a}
.tick.on{background:#d3f2e6;border-color:#16a34a;color:#0b5c49}
.callb{display:flex;align-items:center;justify-content:center;text-decoration:none;background:#16a34a;border-color:#16a34a}
.job.done{background:var(--card);background:color-mix(in srgb,#16a34a 7%,var(--card));border-left-color:#16a34a}
.job.done .hr,.job.done b{opacity:.75}
.job.canc{opacity:.65;border-left-color:#94a3b8}
.job.next{box-shadow:0 0 0 2px #0e7c66,var(--sh)}
.nx{font-size:.8rem;font-weight:700;color:#0e7c66;margin-bottom:2px}
.prog{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#16a34a;border-radius:99px}
.fchips{display:flex;gap:6px;margin:8px 0 2px}
.fchip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.88rem;cursor:pointer;color:var(--tx);min-height:34px}
.fchip.on{background:#0e7c66;border-color:#0e7c66;color:#fff;font-weight:600}
.sech{font:700 .8rem "Poppins",system-ui,sans-serif;letter-spacing:.05em;color:var(--mut);margin:12px 2px 6px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kebab{flex:none;border:0;background:var(--card);box-shadow:var(--sh);border-radius:10px;width:42px;height:42px;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--tx)}
.menu{display:grid;gap:8px}
.fsub{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px;display:grid;gap:8px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
.th .x{position:absolute;top:-6px;right:-6px;background:var(--card);border-radius:50%;box-shadow:var(--sh);width:26px;height:26px;padding:0}
.devimg{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--bg);margin:4px 0 8px}
.raw{white-space:pre-wrap;font-size:.92rem;color:var(--mut);margin:0}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-radius:12px;background:var(--card);box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--tx)}
.res .ri{flex:none;font-size:1.3rem}
.res b{display:block;font-weight:600;overflow-wrap:anywhere}
.res small{display:block;color:var(--mut)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#ov .blk{width:100%;max-width:560px;margin:0 auto}
#ov .scr{margin-top:8px}
#ov textarea{min-height:45vh}

.center{min-height:86vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;max-width:420px;margin:0 auto}
.center .form{display:grid;gap:10px;width:100%;text-align:left}
.big{font-size:3.2rem;line-height:1}
.center h1{margin:0;font-size:1.7rem}
.center h2{margin:0;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:.9rem;color:var(--tx)}
/* aide-mémoire : fil d'Ariane, blocs repliables, liens internes, favoris */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:.8rem;color:var(--mut);margin:0 0 2px}
.crumbs .cb{border:0;background:none;padding:4px 2px;color:var(--ac);cursor:pointer;font-size:.8rem;min-height:28px}
.crumbs .cc{padding:4px 2px;color:var(--mut)}
.tacts{display:flex;gap:8px;flex:none}
.fav{flex:none;border:0;background:var(--card);box-shadow:var(--sh);border-radius:10px;width:42px;height:42px;font-size:1.25rem;line-height:1;cursor:pointer;color:var(--mut)}
.fav.on{color:#d69e00}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:30px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{flex:1;margin:0}
details.fold>summary::after{content:"▾";color:var(--mut);font-size:1rem;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold[open]>summary{margin-bottom:4px}
details.fold>summary+.row{border-top:0}
.ln{display:block}
.row.wr b{color:var(--red)}
.see{display:grid;gap:6px;margin-top:8px}
.seel{border:1px solid var(--bd);background:var(--soft);color:var(--ac);border-radius:10px;padding:8px 10px;text-align:left;font-size:.9rem;font-weight:600;cursor:pointer;min-height:40px}
.flow{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
.flow .fs{border:1px solid var(--bd);border-radius:10px;padding:6px 14px;background:var(--bg);font-weight:600}
.flow .fa{color:var(--mut);line-height:1}
.qbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:14px;padding:14px;margin:4px 0 12px;cursor:pointer;background:var(--c,var(--ac));color:#fff;box-shadow:var(--sh)}
.qbtn .ic{font-size:1.7rem;flex:none}.qbtn b{display:block;font-size:1.05rem}.qbtn small{display:block;opacity:.92}
.qbtn:active{transform:scale(.98)}
.job small.mot{font-size:.86rem;color:var(--tx);opacity:.8;white-space:pre-line}
.recs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
</style>
</head>

function h(t,a,k){var e=document.createElement(t);for(var x in (a||{})){var v=a[x];if(v==null)continue;
 if(x=="class")e.className=v;else if(x=="style")e.style.cssText=v;
 else if(x=="value"||x=="checked"||x=="disabled"||x.slice(0,2)=="on")e[x]=v;else e.setAttribute(x,v)}

 return short?p2(+a[2])+"/"+a[1]+"/"+a[0]:d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}

function digits(s){return String(s||"").replace(/\D/g,"").replace(/^(00)?689(?=\d{8}$)/,"")}
function fmtTel(s){var d=digits(s);return d.length==8?d.replace(/(\d{2})(?=\d)/g,"$1 "):String(s||"").trim()}

 while((m=re.exec(String(s)))){var d=m[3].replace(/\D/g,"");if(d.length==8)out.push({raw:m[0].slice(m[1].length),d:d})}return out}

/* Propriétaire d'une donnée personnelle : « ownerId » (identifiant du compte TechniKit).

function mineAcc(x){return !!CUR&&CUR.role!="admin"&&(x.ownerId?x.ownerId==CUR.id:CUR.id==legacyOwner())}
/* Migration (une seule fois par donnée) : l'ancienne version rangeait l'identifiant du compte dans « acc ».
   Une chaîne dans « acc » = un propriétaire, jamais un oui / non. Renvoie true si la donnée a changé. */
function fixOwner(x){
 var ch=false;
 if(!x.ownerId&&typeof x.acc=="string"&&x.acc){x.ownerId=x.acc;ch=true}
 if(x.kind=="clients"){
  if(typeof x.acc=="string"){
   /* l'ancien code ne gardait une chaîne que si la case « Contrôle d'accès » était décochée → false,
      sauf si l'ancienne fiche commune d'origine existe encore : on reprend sa vraie valeur */
   if(String(x.id).indexOf("cli_")==0){
    if(DB&&!teamCli)return ch;   /* fiches communes pas encore chargées : on réessaiera */
    var o=D.clients.find(function(c){return "cli_"+c.id==x.id});
    x.acc=o?o.acc===true:false;
   }else x.acc=false;
   ch=true;
  }
 }else if("acc" in x){delete x.acc;ch=true}
 return ch;
}

var TAHITI_PLACES=["Papeete","Pirae","Arue","Mahina","Papenoo","Tiarei","Mahaena","Hitiaa","Faaone","Afaahiti","Taravao","Pueu","Tautira","Toahotu","Vairao","Teahupoo","Papearii","Mataiea","Papara","Paea","Punaauia","Faa'a"];

 var k=placeKey(text).replace(/^(a|commune de|secteur)\s+/,"");

var RX_HOUR=/(\d{1,2})\s*(?:h|H|:)\s*(\d{2})?(?![\d\/])/g;
function splitItem(lines){ /* une intervention du planning → heures, téléphone, client, lieu, motif */
 var tel="",hl=[],out={client:"",lieu:"",motif:""},mot=[];
 var clean=lines.map(function(l){findTels(l).forEach(function(x){if(!tel)tel=x.d;l=l.replace(x.raw," ")});return tidy(l)}).filter(Boolean);
 clean.forEach(function(l,i){
  var hasT=/^\s*[-•*▪►>]?\s*\d{1,2}\s*(?:[).]\s+)?\d{0,2}\s*(?:h|H|:)/.test(l)||(i==0&&times(l).length);
  if(hasT){hl=hl.concat(times(l));l=l.replace(RX_HOUR,"")}
  l=tidy(l.replace(/^[\s\-•*▪►>:–—|,]+/,"").replace(/^\d{1,2}\s*[).]\s*/,"").replace(/^(?:à|a)\s+(?=\d|$)/,"").replace(/^[\s\-–—:|,]+/,""));
  if(!l)return;
  var segs=l.split(/\s+[-–—|:]\s+/).map(tidy).filter(Boolean),keep=[];
  segs.forEach(function(sg){var p=findTahitiPlace(sg);if(p&&!out.lieu)out.lieu=p;else if(!p)keep.push(sg)});
  if(!keep.length)return;
  if(!out.client){out.client=keep.shift();if(keep.length)mot.push(keep.join(" – "))}
  else mot.push(keep.join(" – "));
 });
 out.motif=mot.join("\n");out.tel=tel?fmtTel(tel):"";out.hDeb=hl[0]||"";out.hFinPrev=hl[1]||"";
 return out;
}
/* lecture du planning collé */
function findDate(line,yr){
 var l=line.toLowerCase(),m=l.match(/\b(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?\b/);
 if(m&&+m[2]>=1&&+m[2]<=12&&+m[1]>=1&&+m[1]<=31){var y=m[3]?(m[3].length==2?"20"+m[3]:m[3]):yr;return y+"-"+p2(+m[2])+"-"+p2(+m[1])}
 var r=new RegExp("\\b(\\d{1,2})(?:er)?\\s+("+MOIS.join("|")+")(?:\\s+(\\d{4}))?");m=l.match(r);
 if(m)return (m[3]||yr)+"-"+p2(MOISN[MOIS.indexOf(m[2])])+"-"+p2(+m[1]);
 return null;
}
var RX_T=/(\d{1,2})\s*(?:h|H|:)\s*(\d{2})?(?![\d\/])/g;
function times(line){var out=[],m;RX_T.lastIndex=0;while((m=RX_T.exec(line))){var hh=+m[1];if(hh<24)out.push(p2(hh)+":"+(m[2]||"00"))}return out}
var RX_SKIP=/^(bonjour|bonsoir|salut|hello|hi|coucou|ia ora na|cordialement|bien à (vous|toi)|bonne (journée|soirée|semaine|fin de journée)|merci|mauruuru|voici (le|ton|votre|vos) planning|planning|envoyé de mon|de :|à :|objet :|le .{0,40}a écrit)(?![a-zà-ÿ0-9])/i;   /* mot entier : « HINA », « MERCIER » ne sont pas des formules de politesse */
var RX_START=/^\s*(?:[-•*▪►>]|\d{1,2}\s*[).]\s|\d{1,2}\s*(?:h|H|:)\s*\d{0,2})/;
function parsePlanning(txt,defDate){
 var yr=defDate.slice(0,4),days=[],cur=null,bk=[];
 function day(d){cur=days.find(function(x){return x.date==d});if(!cur){cur={date:d,blocks:[]};days.push(cur)}}
 function flush(){if(bk.length){if(!cur)day(defDate);cur.blocks.push(bk)}bk=[]}
 String(txt).replace(/\r/g,"").split("\n").forEach(function(raw){
  var line=raw.replace(/\s+$/,"");
  if(!line.trim()){flush();return}
  var d=findDate(line,yr);
  if(d&&!times(line).length&&!findTels(line).length&&line.trim().length<45){flush();day(d);return}
  if(!times(line).length&&RX_SKIP.test(line.trim())){flush();return}
  bk.push(line.trim());
 });
 flush();
 return days.map(function(dd){
  var items=[];
  dd.blocks.forEach(function(b){
   var starts=b.filter(function(l){return RX_START.test(l)}).length,grp=[];
   if(starts>=2){b.forEach(function(l){if(RX_START.test(l)&&grp.length){items.push(grp);grp=[]}grp.push(l)});if(grp.length)items.push(grp)}
   else items.push(b);
  });
  if(items.length==1&&items[0].length>2&&!items[0].some(function(l){return RX_START.test(l)||findTahitiPlace(l)})&&dd.blocks.length==1)items=items[0].map(function(l){return[l]});
  return{date:dd.date,items:items.map(function(lines){
   var r=splitItem(lines),it=newItem();
   return Object.assign(it,{raw:lines.join("\n"),client:r.client.slice(0,70),tel:r.tel,lieu:r.lieu,motif:r.motif,hDeb:r.hDeb,hFinPrev:r.hFinPrev});
  })};
 });
}

}

function allowed(p){ /* vérifié avant d'afficher chaque page */
 var z=p[0];
 if(!z||z=="reglages")return true;
 if(z=="interventions"||z=="today"||z=="planning"||z=="revenir")return can("planning");
 if(z=="clients")return can("clients");
 if(z=="aide"||T.some(function(x){return x.id==z}))return can("aide");
 return false;
}
function parentOf(p){
 if(!p.length)return [];
 var z=p[0];
 if(z=="admin")return ["admin"];
 if(z=="interventions"||z=="aide"||z=="reglages")return [];
 if(z=="today"||z=="revenir")return ["interventions"];
 if(z=="clients")return p.length>1?["clients"]:(can("planning")?["interventions"]:[]);
 if(z=="planning"){
  if(p.length==1)return ["interventions"];
  var pl=getPlan(p[1]),isT=pl&&pl.date==today();
  if(p.length==2)return isT?["interventions"]:["planning"];
  return isT?["today"]:p.slice(0,2);
 }
 if(p.length==1&&T.some(function(x){return x.id==z}))return ["aide"];
 return p.slice(0,-1);
}
function navKey(){
 if(q||searchOn)return "search";
 if(!path.length)return "home";
 if(path[0]=="today"||(path[0]=="planning"&&path[1]&&(getPlan(path[1])||{}).date==today()))return "today";
 if(path[0]=="aide"||T.some(function(x){return x.id==path[0]}))return "aide";
 return "";
}

 return h("div",{},[h("div",{class:"ban",style:"margin-top:10px"},"Tu n'as pas accès à cette partie. Contacte l'administrateur."),h("button",{class:"btn sec",onclick:function(){nav([])}},"🏠 Accueil")]);

 var show={home:true,today:can("planning"),aide:can("aide"),search:canSearch()},n=0,k=navKey();
 Array.prototype.forEach.call(document.querySelectorAll("#bnav button"),function(b){var key=b.getAttribute("data-k");b.style.display=show[key]?"":"none";if(show[key])n++;b.className=key==k?"on":""});

 if(!force&&((a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&APP.contains(a))||REC)){dirty=true;return}
