<!doctype html>
<html lang="fr">
<body style="margin:0;background:#F5F8FA;font-family:Arial,Helvetica,sans-serif;color:#2D2D2D">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:16px;padding:28px">
        <tr><td style="font-size:22px;font-weight:bold;color:#0F2A5A">Fenua<span style="color:#00796F">Match</span></td></tr>
        <tr><td style="padding-top:20px;font-size:18px;font-weight:bold;color:#0F2A5A">Réinitialisation du mot de passe</td></tr>
        <tr><td style="padding-top:12px;font-size:16px;line-height:1.5">Vous avez demandé à changer votre mot de passe FenuaMatch. Ce lien est valable 1 heure.</td></tr>
        <tr><td style="padding-top:24px">
          <a href="{{ .SiteURL }}/auth/confirmer?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#00B8A9;color:#0F2A5A;font-weight:bold;text-decoration:none;padding:14px 22px;border-radius:12px">Choisir un nouveau mot de passe</a>
        </td></tr>
        <tr><td style="padding-top:20px;font-size:13px;color:#5B6573;line-height:1.5">Si vous n'avez rien demandé, ignorez ce message : votre mot de passe reste inchangé.</td></tr>
      </table>
      <p style="font-size:12px;color:#5B6573;margin-top:16px">FenuaMatch — Le bon talent, au bon endroit.</p>
    </td></tr>
  </table>
</body>
</html>
